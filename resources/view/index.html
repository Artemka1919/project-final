<!DOCTYPE html>

<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"> <!-- Добавляем поддержку UTF-8 кодировки -->
    <title>JiraRush: mini bugtracking system</title>
</head>
<body>
<a href="?lang=ru">Русский</a>
<a href="?lang=en">English</a>


<th:block th:replace="~{layout/main::page(title='JiraRush: mini bugtracking system', appMain=~{::appMain})}">
    <appMain>
        <h1 th:text="#{homePageTitle}">JiraRush Home page</h1>
        <div th:if="${authUser} != null">
            <form action="/ui/logout" method="post">
                <button class="btn btn-primary btn-lg mt-3" type="submit" th:text="#{logoutButton}">Logout</button>
            </form>
        </div>
    </appMain>
</th:block>
</body>
</html>
